<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malaysia 4D AI · Magnum Beta</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8edf8;font:16px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px}h1{font-size:26px;margin:8px 0}small,.muted{color:#a2aec6}.panel{background:#172138;border:1px solid #2b3a56;border-radius:16px;padding:18px;margin:16px 0}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.num{text-align:center;background:#263552;border-radius:12px;padding:18px 5px;font-size:clamp(23px,7vw,36px);font-weight:800;color:#ffd36b;font-variant-numeric:tabular-nums}.num small{display:block;font-size:12px;font-weight:400;color:#b3bfd6}button{background:#ffd36b;color:#131b2b;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#status{line-height:1.6}.table-scroll{overflow-x:auto}.table-scroll table{min-width:360px}table{border-collapse:collapse;width:100%}td,th{padding:9px 5px;border-bottom:1px solid #34425a;text-align:left}footer{font-size:13px;color:#a2aec6;line-height:1.6}</style></head>
<body><main><small>INDEPENDENT OPERATOR MODEL · BETA</small><h1>Magnum 4D · Top 3</h1><p class="muted">马来西亚4D预测测试版 · 仅使用 Magnum 历史开奖数据</p>
<div class="panel"><div id="status" role="status">正在加载真实历史数据…</div><p><button id="refresh" disabled>重新计算</button></p></div>
<div class="panel"><h2>Top 3 排名号码</h2><div class="nums" id="numbers"><div class="num">----</div><div class="num">----</div><div class="num">----</div></div><p class="muted" id="method"></p></div>
<div class="panel"><h2>历史样本外回测</h2><p class="muted">逐期只使用当期开奖之前的数据；命中仅计算第一、第二、第三奖。</p><p><button id="backtest" disabled>回测最近30期</button></p><div id="backtest-status" class="muted">尚未运行</div><div class="table-scroll"><table><thead><tr><th>日期</th><th>预测Top 3</th><th>实际前三奖</th><th>结果</th></tr></thead><tbody id="backtest-rows"></tbody></table></div></div><div class="panel"><h2>最近一期历史开奖</h2><table><tbody id="latest"><tr><td>加载中…</td></tr></tbody></table></div>
<footer>号码为统计模型排序，不是中奖概率或收益保证。模型只使用指定截止日期之前的数据；本页不提供投注服务。数据源：项目内 data/normalized/magnum_draws.csv。</footer>
</main><script>
const URL='data/normalized/magnum_draws.csv', START='2006-01-01';
const $=id=>document.getElementById(id);
let rows=[];
function loadCsv(text) {
  const [header, ...lines] = text.trim().split(/\r?\n/);
  const columns = header.split(',');
  const dateIndex = columns.indexOf('date');
  const prizeIndexes = ['prize_1', 'prize_2', 'prize_3'].map(key => columns.indexOf(key));
  if ([dateIndex, ...prizeIndexes].includes(-1)) throw Error('CSV 缺少开奖日期或前三奖栏位');

  const draws = [];
  for (const line of lines) {
    const fields = line.split(',');
    const date = fields[dateIndex]?.trim();
    if (!date || date < START || !/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
    const timestamp = Date.parse(date + 'T00:00:00Z');
    if (!Number.isFinite(timestamp) || new Date(timestamp).toISOString().slice(0, 10) !== date) continue;
    const prizes = prizeIndexes.map(index => fields[index]?.trim());
    if (prizes.every(number => /^\d{4}$/.test(number))) draws.push({date, prizes});
  }
  return draws.sort((a, b) => a.date.localeCompare(b.date));
}
function weight(date,asOf){const age=(Date.parse(asOf+'T00:00:00Z')-Date.parse(date+'T00:00:00Z'))/86400000/365.2425;return age<3?.6:age<=10?.25:age<=20?.15:0}
function rank(history,asOf){const counts=Array.from({length:4},()=>Array(10).fill(0));const totals=Array(4).fill(10);for(const r of history){if(r.date>=asOf)continue;const w=weight(r.date,asOf);if(!w)continue;for(const n of r.prizes)for(let p=0;p<4;p++){counts[p][+n[p]]+=w;totals[p]+=w}}const result=[];for(let i=0;i<10000;i++){const n=String(i).padStart(4,'0');let score=0;for(let p=0;p<4;p++)score+=Math.log((counts[p][+n[p]]+1)/totals[p]);result.push({n,score:Number(score.toFixed(8))})}result.sort((a,b)=>b.score-a.score||a.n.localeCompare(b.n));return result.slice(0,3)}
async function backtest(){const btn=$('backtest');btn.disabled=true;$('backtest-status').textContent='正在计算…';$('backtest-rows').innerHTML='';let hits=0;const out=[];const start=Math.max(1,rows.length-30);for(let i=start;i<rows.length;i++){const actual=rows[i];const predicted=rank(rows.slice(0,i),actual.date).map(x=>x.n);const matched=predicted.filter(n=>actual.prizes.includes(n));if(matched.length)hits++;out.push('<tr><td>'+actual.date+'</td><td>'+predicted.join(', ')+'</td><td>'+actual.prizes.join(', ')+'</td><td>'+(matched.length?'命中 '+matched.join(', '):'未命中')+'</td></tr>');if((i-start)%5===4){$('backtest-status').textContent='已计算 '+(i-start+1)+'/'+(rows.length-start)+' 期';await new Promise(resolve=>setTimeout(resolve,0))}}$('backtest-rows').innerHTML=out.reverse().join('');$('backtest-status').textContent='回测 '+out.length+' 期；前三奖命中 '+hits+' 期（'+(hits/out.length*100).toFixed(2)+'%）。仅为历史表现，不代表未来中奖概率。';btn.disabled=false}
function render(){if(!rows.length)return;const last=rows[rows.length-1];const next=new Date(last.date+'T00:00:00Z');next.setUTCDate(next.getUTCDate()+1);const asOf=next.toISOString().slice(0,10);const top=rank(rows,asOf);$('numbers').innerHTML=top.map((r,i)=>'<div class="num"><small>#'+(i+1)+'</small>'+r.n+'</div>').join('');$('status').textContent='已读取 '+rows.length.toLocaleString()+' 期有效记录｜数据截至 '+last.date+'｜排名基准 '+asOf;$('method').textContent='按数字位置频率加权排序（近3年 0.60、3–10年 0.25、10–20年 0.15）；不混用其他运营商数据。';$('latest').innerHTML='<tr><th>开奖日期</th><td>'+last.date+'</td></tr>'+last.prizes.map((n,i)=>'<tr><th>'+(i+1)+'奖</th><td>'+n+'</td></tr>').join('')}
async function init(){try{const res=await fetch(URL+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);rows=loadCsv(await res.text());if(!rows.length)throw Error('没有符合要求的记录');render();$('refresh').disabled=false;$('backtest').disabled=rows.length<2;if(rows.length<2)$('backtest-status').textContent='至少需要两期开奖记录';}catch(e){$('status').textContent='数据加载失败：'+e.message+'。请通过已部署的网站访问，或在仓库根目录启动静态服务器。'}}
$('refresh').addEventListener('click',render);$('backtest').addEventListener('click',backtest);init();
</script></body></html>

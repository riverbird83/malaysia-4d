name: Deploy Magnum Prediction Beta to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # 20:00 and 21:00 Malaysia time: fetch results, then retry.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    # 08:15 Malaysia time: catch up on late Grand Dragon results.
    - cron: "15 0 * * *"
    # 12:00 Malaysia time: lock and publish the draw-day forecast.
    - cron: "0 4 * * *"
  push:
    branches: [main, data-quality-foundation]
    paths:
      - prediction.html
      - scripts/export_magnum_report.py
      - scripts/archive_magnum_prediction.py
      - scripts/model_experiment.py
      - scripts/prediction_engine.py
      - data/normalized/magnum_draws.csv
      - data/normalized/haolong_draws.csv
      - data/normalized/damacai_draws.csv
      - data/normalized/sportstoto_draws.csv
      - 'data/*_top3_supplement.csv'
      - scripts/update_other_top3.py
      - data/grand_dragon_top3_supplement.csv
      - .github/workflows/deploy-magnum-beta.yml

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: magnum-beta-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/data-quality-foundation' || github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: data-quality-foundation
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lock pre-draw predictions
        if: github.ref == 'refs/heads/main' && (github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          python scripts/archive_magnum_prediction.py
          git add -- 'data/*-live.json'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Lock 4D predictions before the draw'
            git push origin HEAD:refs/heads/data-quality-foundation
          fi
      - name: Fetch and record complete official draws
        if: github.ref == 'refs/heads/main' && (github.event.schedule == '0 12 * * *' || github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          python -m pip install requests pandas
          python scripts/update_magnum_beta.py
          python scripts/update_other_top3.py
          git add data/magnum_draws.csv data/normalized/magnum_draws.csv data/source_snapshots/magnum_updates.csv
          git add -- data/*_top3_supplement.csv
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update official 4D draw results'
            git push origin HEAD:refs/heads/data-quality-foundation
          fi
      - name: Catch up on late Grand Dragon results
        if: github.ref == 'refs/heads/main' && github.event.schedule == '15 0 * * *'
        run: |
          python scripts/update_other_top3.py --grand-dragon-only
          git add data/grand_dragon_top3_supplement.csv
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Catch up on late Grand Dragon results'
            git push origin HEAD:refs/heads/data-quality-foundation
          fi
      - name: Summarize the live model comparison
        run: python scripts/archive_magnum_prediction.py --summary-only >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare minimal static site
        run: |
          mkdir -p public/data/normalized
          cp prediction.html public/index.html
          python scripts/export_magnum_report.py public/data/magnum-report.json
          python scripts/export_magnum_report.py public/data/grand-dragon-report.json --operator haolong
          python scripts/export_magnum_report.py public/data/damacai-report.json --operator damacai
          python scripts/export_magnum_report.py public/data/sportstoto-report.json --operator sportstoto
          cp data/normalized/magnum_draws.csv public/data/normalized/magnum_draws.csv
          test -s public/index.html
          test -s public/data/normalized/magnum_draws.csv
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" --jq '.total_count') || count=0
            if [[ "$count" == 1 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}

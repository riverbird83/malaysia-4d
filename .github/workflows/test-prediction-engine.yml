name: Test 4D Prediction Engine

on:
  push:
    branches:
      - data-quality-foundation
    paths:
      - "scripts/prediction_engine.py"
      - "tests/test_prediction_engine.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-quality-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run prediction engine tests
        run: |
          python -m unittest discover -s tests -p "test_prediction_engine.py" -v

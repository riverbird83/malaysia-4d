name: Backfill Sport Toto 2006-2011 Consolation

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/sportstoto-consolation-2006-2011
    paths:
      - scripts/backfill_sportstoto_consolation.py
      - tests/test_4d2u_parser.py
      - .github/workflows/backfill-sportstoto-2006-2011.yml

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Validate 4D2U parser against known historical draw
        run: python -m unittest discover -s tests -p "test_4d2u_parser.py" -v

      - name: Run multi-source historical backfill
        run: python scripts/backfill_sportstoto_consolation.py

      - name: Upload recovered candidate dataset
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sportstoto-2006-2011-backfilled-candidate
          path: data/backfill/sportstoto_draws_backfilled.csv
          if-no-files-found: error
          retention-days: 30

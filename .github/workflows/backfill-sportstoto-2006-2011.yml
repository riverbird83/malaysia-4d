name: Backfill Sport Toto 2006-2011 Consolation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: data-quality-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Run official-source historical backfill
        run: python scripts/backfill_sportstoto_consolation.py

      - name: Upload recovered candidate dataset
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sportstoto-2006-2011-backfilled-candidate
          path: data/backfill/sportstoto_draws_backfilled.csv
          if-no-files-found: error
          retention-days: 30
